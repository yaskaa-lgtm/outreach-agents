# gitleaks configuration: https://github.com/gitleaks/gitleaks#configuration
# Used by the pre-commit hook and by the CI job (which scans the full Git history).

title = "outreach-agents"

# Keep every default rule (Anthropic, GitHub, AWS, generic API keys, private keys, ...).
[extend]
useDefault = true

# Fernet keys encrypt SMTP/IMAP credentials at rest: 32 random bytes, URL-safe base64.
[[rules]]
id = "fernet-key"
description = "Fernet encryption key (app-level encryption of stored credentials)"
regex = '''(?i)fernet[_-]?key\s*[:=]\s*['"]?([A-Za-z0-9_\-]{43}=)'''
keywords = ["fernet"]
