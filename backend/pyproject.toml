[project]
name = "outreach-agents-backend"
version = "0.0.0"
description = "FastAPI backend and worker for outreach-agents."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

# The importable package is `app/`, directly in this folder (no `src/` layout).
[tool.uv.build-backend]
module-name = "app"
module-root = ""
