# Development workspace root.
# One virtual environment (.venv) and one lockfile (uv.lock) for the backend
# package and the evals. Run every Python command from the repository root:
#   uv sync          -> install everything
#   uv run pytest    -> run the tests
[project]
name = "outreach-agents"
version = "0.0.0"
description = "Autonomous B2B prospecting agents (development workspace)."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["outreach-agents-backend"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
outreach-agents-backend = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

# --- Ruff (lint + format) ----------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["web"]
# Where first-party imports live (`app` is in backend/, `evals` at the root).
src = ["backend", "."]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "B",     # bugbear
  "UP",    # pyupgrade
  "S",     # bandit (security)
  "SIM",   # simplify
  "ASYNC", # async pitfalls
  "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and call git/pre-commit through subprocess on purpose.
"backend/tests/**" = ["S101", "S105", "S106", "S603", "S607"]

# --- mypy (type checking) ----------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["backend/app"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs a running PostgreSQL (docker compose up db)",
  "slow: takes more than a few seconds (e.g. builds gitleaks on first run)",
]

[tool.coverage.run]
source = ["backend/app"]
branch = true
